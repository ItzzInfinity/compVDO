[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compvdo"
version = "0.1.0"
description = "Local, offline video re-compression for phone footage"
requires-python = ">=3.10"
dependencies = []                      # core is stdlib-only, by design

[project.optional-dependencies]
gui = ["PySide6==6.11.2"]
dev = ["PySide6==6.11.2", "pytest==8.3.4"]

[project.scripts]
compvdo = "compvdo.cli:main"

[project.gui-scripts]
compvdo-gui = "compvdo.gui.app:main"

[tool.setuptools.packages.find]
include = ["compvdo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
